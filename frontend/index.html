<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>遗迹图书馆 · Reliquiarum to Library</title>
    <script>
      // 防闪烁：首帧前从 localStorage 恢复主题（与 src/app/theme.ts 的 key/合法值保持一致）。
      // 设置页选择即刷新，故首帧即为目标主题；非法值静默忽略 = 回落默认基线。
      ;(function () {
        try {
          var VALID_COLOR = ['parchment', 'jade', 'fir', 'celadon', 'charcoal', 'sandstone']
          var VALID_DESIGN = ['woodcut', 'faceted', 'copperplate', 'shoji', 'runic', 'wrought']
          var c = localStorage.getItem('rtl.color-theme')
          var d = localStorage.getItem('rtl.design-theme')
          if (c && VALID_COLOR.indexOf(c) !== -1) document.documentElement.dataset.color = c
          if (d && VALID_DESIGN.indexOf(d) !== -1) document.documentElement.dataset.design = d
        } catch (e) {
          /* localStorage 不可用（隐私模式等）：静默回落默认主题 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
